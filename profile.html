<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - EBURG</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/maintenance.js"></script>
    <script src="/imgfix.js"></script>
</head>
<body>

    <!-- YOUR CLASSIC HEADER & LAYOUT HERE -->
    <div id="profile-card">
        <h1 id="username-display">Loading...</h1>
        <p id="user-status"></p>
    </div>

    <!-- Hidden 404 Container (Only triggers if user genuinely doesn't exist) -->
    <div id="not-found-view" style="display: none; text-align: center; padding: 50px;">
        <img src="https://raw.githubusercontent.com/EBURGG/site/refs/heads/main/placeholders/notfound.png" style="max-width: 400px; width: 100%;">
        <h2>User Not Found</h2>
        <a href="/home">Return Home</a>
    </div>

<script>
    async function loadProfile() {
        // Extracts "1" or "EBURG" from the URL path (/users/1/profile)
        const matches = window.location.pathname.match(/\/users\/([^\/]+)\/profile/);
        const userId = matches ? matches[1] : null;

        if (!userId) {
            show404();
            return;
        }

        try {
            const res = await fetch(`/api/get-user?id=${encodeURIComponent(userId)}`);
            if (!res.ok) {
                show404();
                return;
            }

            const data = await res.json();

            // Set text on your original HTML elements (change IDs if yours are named differently)
            if (document.getElementById('username-display')) {
                document.getElementById('username-display').innerText = data.username;
            }
            if (document.getElementById('user-status')) {
                document.getElementById('user-status').innerText = data.status || '';
            }

            document.title = `${data.username} - Profile`;
        } catch (err) {
            show404();
        }
    }

    function show404() {
        // Hides your profile card and shows the not found message if user isn't in DB
        if (document.getElementById('profile-card')) document.getElementById('profile-card').style.display = 'none';
        if (document.getElementById('not-found-view')) document.getElementById('not-found-view').style.display = 'block';
    }

    loadProfile();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline for Maintenance</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/EBURGG/site/refs/heads/main/canvas.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .maintenance-img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
    <script src="/imgfix.js"></script>
</head>
<body>

    <img src="https://raw.githubusercontent.com/EBURGG/site/refs/heads/main/maintenance.png" alt="EBURG Maintenance" class="maintenance-img">

    <script>
        // Check if maintenance is turned OFF so users can automatically go back to /home
        async function checkStatus() {
            try {
                const res = await fetch('/status.json?t=' + Date.now());
                const data = await res.json();
                if (!data.maintenance) {
                    window.location.href = '/home';
                }
            } catch(e) {}
        }
        setInterval(checkStatus, 5000); // Check every 5 seconds
    </script>
</body>
</html>
